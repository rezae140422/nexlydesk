name: NexlyDesk Release (Windows + Android)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v0.1.0-alpha
        type: string
      skip_release:
        description: Build + test only (no release/draft)
        default: false
        type: boolean
  push:
    tags:
    - v*
permissions:
  contents: write
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  CARGO_NDK_VERSION: 3.1.2
  SCITER_ARMV7_CMAKE_VERSION: 3.29.7
  SCITER_NASM_DEBVERSION: 2.15.05-1
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_WINDOWS_ARM_VERSION: 3.44.9
  FLUTTER_MACOS_ARM_VERSION: 3.44.9
  FLUTTER_ELINUX_VERSION: 3.16.9
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  ARMV7_VCPKG_COMMIT_ID: 6f29f12e82a8293156836ad81cc9bf5af41fe836
  VERSION: 1.5.1
  NDK_VERSION: r28c
  UPLOAD_ARTIFACT: 'true'
  PUBLISH_UPDATE_METADATA: 'false'
  SIGN_BASE_URL: '-2'
  TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
        - platform: x64
          target: windows-2022
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10
  build-windows:
    name: ${{ matrix.job.target }}
    needs:
    - build-RustDeskTempTopMostWindow
    - generate-bridge
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          flutter-arch: x64
          vcpkg-triplet: x64-windows-static
          build-args: --vram
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
        path: ./
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
        architecture: x64
    - name: Force arm64 Dart SDK + engine
      if: ${{ matrix.job.arch == 'aarch64' }}
      run: "$flutterRoot = \"${{ steps.flutter.outputs['CACHE-PATH'] }}\"\nWrite-Host \"PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE\"\nWrite-Host \"Flutter root: $flutterRoot\"\nRemove-Item -Force \"$flutterRoot\\bin\\cache\\engine-dart-sdk.stamp\" -ErrorAction SilentlyContinue\n& \"$flutterRoot\\bin\\internal\\update_dart_sdk.ps1\"\n# Confirm the Dart we ended up with is arm64 (\"on windows_arm64\"); fail loudly if not.\n$dartVer = & \"$flutterRoot\\bin\\dart.bat\" --version 2>&1 | Out-String\nWrite-Host $dartVer\nif ($dartVer -notmatch \"windows_arm64\") {\n  Write-Error \"Expected an arm64 Dart SDK but got: $dartVer\"\n  exit 1\n}\n& \"$flutterRoot\\bin\\flutter.bat\" precache --windows\n# Fail fast if precache pulled the wrong-arch Windows engine: an arm64 Dart should\n# fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust build.\n$engineDir = \"$flutterRoot\\bin\\cache\\artifacts\\engine\"\nWrite-Host \"Engine artifacts present:\"\nGet-ChildItem $engineDir\
        \ -Directory | Select-Object -ExpandProperty Name | Write-Host\nif (-not (Test-Path \"$engineDir\\windows-arm64-release\")) {\n  Write-Error \"Expected windows-arm64-release engine artifacts but they are missing (wrong-arch SDK).\"\n  exit 1\n}\n"
    - name: Replace engine with rustdesk custom flutter engine
      if: ${{ matrix.job.arch == 'x86_64' }}
      run: 'flutter doctor -v

        flutter precache --windows

        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip

        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release

        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

        '
    - name: Patch flutter
      if: ${{ matrix.job.arch == 'x86_64' }}
      shell: bash
      run: "cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))\ncd $(dirname $(dirname $(which flutter)))\nif [[ \"3.24.5\" == ${{env.FLUTTER_VERSION}} ]]; then\n  git apply flutter_3.24.4_dropdown_menu_enableFilter.diff\nfi\n"
    - name: Patch RustDesk sources for Flutter 3.44 (arm64)
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: bash .github/patches/apply_flutter_3.44_source_patches.sh
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log\" || true\n"
      shell: bash
    - name: Set SODIUM_LIB_DIR (arm64)
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"
    - name: Build rustdesk
      run: "# Windows: build RustDesk\n# --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix\npython3 .\\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}\nmv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk\nmv ./rustdesk/rustdesk.exe ./rustdesk/NexlyDesk.exe\n\n# Download usbmmidd_v2.zip and extract it to ./rustdesk\nInvoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip\nExpand-Archive usbmmidd_v2.zip -DestinationPath .\nRemove-Item -Path usbmmidd_v2\\Win32 -Recurse\nRemove-Item -Path \"usbmmidd_v2\\deviceinstaller64.exe\", \"usbmmidd_v2\\deviceinstaller.exe\", \"usbmmidd_v2\\usbmmidd.bat\"\nmv -Force .\\usbmmidd_v2 ./rustdesk\n\n# Download printer driver files and extract them to ./rustdesk\ntry {\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip\n\
        \  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums\n\n  # Check and move the files\n  $checksum_driver = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*rustdesk_printer_driver_v4-1.4\\.zip$').Matches.Groups[1].Value\n  $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256\n  $checksum_adapter = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*printer_driver_adapter\\.zip$').Matches.Groups[1].Value\n  $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256\n  if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {\n      Write-Output \"rustdesk_printer_driver_v4-1.4, checksums match, extract the file.\"\n\
        \      Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .\n      mkdir ./rustdesk/drivers\n      mv -Force .\\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver\n      Expand-Archive printer_driver_adapter.zip -DestinationPath .\n      mv -Force .\\printer_driver_adapter.dll ./rustdesk\n  } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {\n      Write-Output \"rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file.\"\n  } else {\n      Write-Output \"printer_driver_adapter.dll, checksums do not match, ignore the file.\"\n  }\n} catch {\n    Write-Host \"Ingore the printer driver error.\"\n}\n"
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: "runner_res=$(find . -name \"Runner.res\");\nif [ \"$runner_res\" == \"\" ]; then\n  echo \"Runner.res: not found\";\nelse\n  echo \"Runner.res: $runner_res\";\n  cp $runner_res ./libs/portable/Runner.res;\n  echo \"list ./libs/portable/Runner.res\";\n  ls -l ./libs/portable/Runner.res;\nfi\n"
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
        path: ./rustdesk
    - name: Verify Windows Flutter version
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true'
      shell: powershell
      run: "$reportedVersion = (& \".\\rustdesk\\rustdesk.exe\" --version | Out-String).Trim()\nif ($LASTEXITCODE -ne 0) {\n  throw \"rustdesk --version exited with $LASTEXITCODE\"\n}\nif ($reportedVersion -cne $env:VERSION) {\n  throw \"RustDesk reports version '$reportedVersion', expected '$env:VERSION'\"\n}\n"
    - name: Verify template payload signatures
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: powershell
      run: "Get-ChildItem ./rustdesk -Recurse -File -ErrorAction Stop |\n  Where-Object { $_.Extension -eq '.exe' -or ($_.Extension -eq '.dll' -and $_.FullName -notmatch 'RustDeskPrinterDriver|usbmmidd_v2') } |\n  ForEach-Object {\n    $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName -ErrorAction Stop\n    if ($signature.Status -ne 'Valid') { throw \"Invalid template payload signature: $($_.FullName) ($($signature.Status))\" }\n  }\n"
    - name: Build template packer
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: 'sed -i ''/dpiAware/d'' res/manifest.xml

        pushd ./libs/portable

        pip3 install -r requirements.txt

        python3 ./generate.py -f ../../rustdesk/ -e rustdesk.exe -l 11 -t "${{ matrix.job.target }}" --exclude-exe

        popd

        mkdir -p ./packer-template

        cp ./target/${{ matrix.job.target }}/release/rustdesk-portable-packer.exe ./packer-template/rustdesk-template-${{ matrix.job.arch }}.exe

        '
    - name: Upload unsigned template packer
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-unsigned-packer-template-${{ matrix.job.arch }}
        path: ./packer-template
        if-no-files-found: error
    - name: Build self-extracted executable
      shell: bash
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'sed -i ''/dpiAware/d'' res/manifest.xml

        pushd ./libs/portable

        pip3 install -r requirements.txt

        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/NexlyDesk.exe

        popd

        mkdir -p ./SignOutput

        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

        '
    - name: Rename & upload NexlyDesk exe
      shell: bash
      run: mkdir -p out && mv ./SignOutput/rustdesk-*-x86_64.exe out/NexlyDesk-windows-x64.exe && ls -la out
    - uses: actions/upload-artifact@v4
      with:
        name: nexlydesk-windows
        path: out/NexlyDesk-windows-x64.exe
  build-android-lib:
    needs:
    - generate-bridge
    name: build rustdesk android apk ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: armv7
          target: armv7-linux-androideabi
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: x86_64
          target: x86_64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Install dependencies
      run: "sudo apt-get update\nsudo apt-get install -y \\\n     clang \\\n     cmake \\\n     curl \\\n     gcc-multilib \\\n     git \\\n     g++ \\\n     g++-multilib \\\n     libayatana-appindicator3-dev \\\n     libasound2-dev \\\n     libc6-dev \\\n     libclang-dev \\\n     libunwind-dev \\\n     libgstreamer1.0-dev \\\n     libgstreamer-plugins-base1.0-dev \\\n     libgtk-3-dev \\\n     libpulse-dev \\\n     libva-dev \\\n     libxcb-randr0-dev \\\n     libxcb-shape0-dev \\\n     libxcb-xfixes0-dev \\\n     libxdo-dev \\\n     libxfixes-dev \\\n     llvm-dev \\\n     nasm \\\n     ninja-build \\\n     openjdk-17-jdk-headless \\\n     pkg-config \\\n     tree \\\n     wget\n"
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
    - name: Patch flutter
      run: "cd $(dirname $(dirname $(which flutter)))\nif [[ \"3.24.5\" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then\n  git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff\nfi\n"
    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: "case ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    ANDROID_TARGET=arm64-v8a\n  ;;\n  armv7-linux-androideabi)\n    ANDROID_TARGET=armeabi-v7a\n  ;;\n  x86_64-linux-android)\n    ANDROID_TARGET=x86_64\n  ;;\n  i686-linux-android)\n    ANDROID_TARGET=x86\n  ;;\nesac\nif ! ./flutter/build_android_deps.sh \"${ANDROID_TARGET}\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\n"
      shell: bash
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-android
        key: ${{ matrix.job.target }}
    - name: Build rustdesk lib
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: "rustup target add ${{ matrix.job.target }}\ncargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked\ncase ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    ./flutter/ndk_arm64.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n  ;;\n  armv7-linux-androideabi)\n    ./flutter/ndk_arm.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\n  ;;\n  x86_64-linux-android)\n    ./flutter/ndk_x64.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\n  ;;\n  i686-linux-android)\n    ./flutter/ndk_x86.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86\n\
        \    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n  ;;\nesac\n"
    - name: Upload Rustdesk library to Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: librustdesk.so.${{ matrix.job.target }}
        path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so
  build-android-universal:
    needs:
    - build-android-lib
    name: build rustdesk android universal apk
    runs-on: ubuntu-24.04
    env:
      reltype: release
      x86_target: ''
      suffix: ''
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Install dependencies
      run: "sudo apt-get update\nsudo apt-get install -y \\\n     clang \\\n     cmake \\\n     curl \\\n     gcc-multilib \\\n     git \\\n     g++ \\\n     g++-multilib \\\n     libayatana-appindicator3-dev \\\n     libasound2-dev \\\n     libc6-dev \\\n     libclang-dev \\\n     libunwind-dev \\\n     libgstreamer1.0-dev \\\n     libgstreamer-plugins-base1.0-dev \\\n     libgtk-3-dev \\\n     libpulse-dev \\\n     libva-dev \\\n     libxcb-randr0-dev \\\n     libxcb-shape0-dev \\\n     libxcb-xfixes0-dev \\\n     libxdo-dev \\\n     libxfixes-dev \\\n     llvm-dev \\\n     nasm \\\n     ninja-build \\\n     openjdk-17-jdk-headless \\\n     pkg-config \\\n     tree \\\n     wget\n"
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
    - name: Patch flutter
      run: "cd $(dirname $(dirname $(which flutter)))\nif [[ \"3.24.5\" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then\n  git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff\nfi\n"
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Download Rustdesk library from Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: librustdesk.so.aarch64-linux-android
        path: ./flutter/android/app/src/main/jniLibs/arm64-v8a
    - name: Download Rustdesk library from Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: librustdesk.so.armv7-linux-androideabi
        path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a
    - name: Download Rustdesk library from Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: librustdesk.so.x86_64-linux-android
        path: ./flutter/android/app/src/main/jniLibs/x86_64
    - name: Download Rustdesk library from Artifacts
      if: ${{ env.reltype == 'debug' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: librustdesk.so.i686-linux-android
        path: ./flutter/android/app/src/main/jniLibs/x86
    - name: Build rustdesk
      shell: bash
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: "export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH\n# Increase Gradle JVM memory for CI builds\nsed -i \"s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g\" ./flutter/android/gradle.properties\n# temporary use debug sign config\nsed -i \"s/signingConfigs.release/signingConfigs.debug/g\" ./flutter/android/app/build.gradle\nmv ./flutter/android/app/src/main/jniLibs/arm64-v8a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\ncp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/\nmv ./flutter/android/app/src/main/jniLibs/armeabi-v7a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\ncp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/\nmv ./flutter/android/app/src/main/jniLibs/x86_64/liblibrustdesk.so\
        \ ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\ncp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/\nif [ \"${{ env.reltype }}\" = \"debug\" ]; then\n  mv ./flutter/android/app/src/main/jniLibs/x86/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n  cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86/\nfi\n# build flutter\npushd flutter\nflutter build apk \"--${{ env.reltype }}\" --target-platform android-arm64,android-arm,android-x64${{ env.x86_target }}\npopd\nmkdir -p signed-apk\nmv ./flutter/build/app/outputs/flutter-apk/app-${{ env.reltype }}.apk signed-apk/rustdesk-${{ env.VERSION }}-universal${{ env.suffix }}.apk\n"
    - name: Rename & upload NexlyDesk apk
      shell: bash
      run: mkdir -p out && mv signed-apk/rustdesk-*-universal*.apk out/NexlyDesk-android-universal.apk && ls -la out
    - uses: actions/upload-artifact@v4
      with:
        name: nexlydesk-android
        path: out/NexlyDesk-android-universal.apk
  test-flutter-widgets:
    name: 'test: full ID/password widget (no truncation)'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: flutter test nexly_full_value_test.dart
      working-directory: flutter
      run: flutter pub get && flutter test test/nexly_full_value_test.dart test/nexly_direct_mode_test.dart 2>&1 | tee ../widget-test.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: evidence-widget-test
        path: widget-test.log
  test-windows-direct-ip:
    name: 'test: Windows install, launch, full ID, direct-IP session, uninstall'
    needs: [build-windows]
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      REQUIRE_DEFAULT_DIRECT: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/nexly-tests
    - uses: actions/download-artifact@v4
      with:
        name: nexlydesk-windows
        path: dist
    - name: run test
      shell: pwsh
      run: .github/nexly-tests/directip.ps1
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: evidence-windows-direct-ip
        path: evidence
  test-android:
    name: 'test: Android emulator (install, launch, ID, no crash, uninstall)'
    needs: [build-android-universal]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/nexly-tests
    - uses: actions/download-artifact@v4
      with:
        name: nexlydesk-android
        path: dist
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_apis
        disable-animations: true
        profile: pixel_6
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash .github/nexly-tests/android.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: evidence-android
        path: evidence
  release:
    if: ${{ !inputs.skip_release }}
    needs:
    - build-windows
    - build-android-universal
    - test-flutter-widgets
    - test-windows-direct-ip
    - test-android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/nexly-tests
    - uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: nexlydesk-*
        merge-multiple: true
    - name: Create DRAFT GitHub Release (unsigned)
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -e
        ls -la dist
        TAG="${TAG_NAME}"
        # DRAFT only: publishing / flipping v0.1.0-alpha happens manually after approval.
        if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
        else
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "NexlyDesk $TAG" --notes-file .github/nexly-tests/RELEASE_NOTES.md
        fi
