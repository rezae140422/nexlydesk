name: NexlyDesk tests only (reuse build artifacts)
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: run id whose artifacts to test
        required: true
permissions:
  contents: read
  actions: read
jobs:
  test-windows-direct-ip:
    name: 'test: Windows install, launch, full ID, direct-IP session, uninstall'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      REQUIRE_DEFAULT_DIRECT: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/nexly-tests
    - uses: actions/download-artifact@v4
      with:
        name: nexlydesk-windows
        path: dist
        run-id: ${{ inputs.build_run }}
        github-token: ${{ github.token }}
    - name: run test
      shell: pwsh
      run: .github/nexly-tests/directip.ps1
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: evidence-windows-direct-ip
        path: evidence
  test-android:
    name: 'test: Android emulator (install, launch, ID, no crash, uninstall)'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/nexly-tests
    - uses: actions/download-artifact@v4
      with:
        name: nexlydesk-android
        path: dist
        run-id: ${{ inputs.build_run }}
        github-token: ${{ github.token }}
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_apis
        disable-animations: true
        profile: pixel_6
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash .github/nexly-tests/android.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: evidence-android
        path: evidence
