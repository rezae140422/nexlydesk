name: NexlyDesk tests only (reuse build artifacts)
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: run id whose artifacts to test
        required: true
permissions:
  contents: read
  actions: read
jobs:
  test-windows-host:
    name: 'test: Windows host (install, launch, ID, accept session, uninstall)'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/nexly-tests
    - uses: actions/download-artifact@v4
      with:
        name: nexlydesk-windows
        path: dist
        run-id: ${{ inputs.build_run }}
        github-token: ${{ github.token }}
    - name: install + launch + ID/password
      shell: pwsh
      run: .github/nexly-tests/host.ps1 start
    - uses: actions/upload-artifact@v4
      with:
        name: host-id
        path: share/host.txt
    - name: wait for client session
      shell: pwsh
      run: .github/nexly-tests/host.ps1 wait
    - name: uninstall
      shell: pwsh
      run: .github/nexly-tests/host.ps1 uninstall
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: evidence-windows-host
        path: evidence
  test-windows-client:
    name: 'test: Windows client (install, launch, connect via public server, uninstall)'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/nexly-tests
    - uses: actions/download-artifact@v4
      with:
        name: nexlydesk-windows
        path: dist
        run-id: ${{ inputs.build_run }}
        github-token: ${{ github.token }}
    - name: install + launch + connect
      shell: pwsh
      run: .github/nexly-tests/client.ps1 start
    - name: signal done
      if: always()
      shell: pwsh
      run: New-Item -ItemType Directory -Force done | Out-Null; 'done' | Out-File done/done.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: client-done
        path: done/done.txt
    - name: uninstall
      shell: pwsh
      run: .github/nexly-tests/client.ps1 uninstall
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: evidence-windows-client
        path: evidence
  test-android:
    name: 'test: Android emulator (install, launch, ID, no crash, uninstall)'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/nexly-tests
    - uses: actions/download-artifact@v4
      with:
        name: nexlydesk-android
        path: dist
        run-id: ${{ inputs.build_run }}
        github-token: ${{ github.token }}
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash .github/nexly-tests/android.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: evidence-android
        path: evidence
